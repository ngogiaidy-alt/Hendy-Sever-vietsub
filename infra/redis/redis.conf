# ==============================================================================
# Hendy-Server Redis Configuration
# File: infra/redis/redis.conf
# High-throughput Task Queue Buffer & Pub/Sub broker for Builder & Media Nodes
# ==============================================================================

# Network & Ports
bind 0.0.0.0
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

# Memory Management
maxmemory 2gb
maxmemory-policy allkeys-lru

# Persistence (AOF for durability during queue operations)
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# RDB Snapshots
save 900 1
save 300 10
save 60 10000
dbfilename dump.rdb
dir /data

# Security
# requirepass hendy_redis_secret_password

# Client Limits
maxclients 10000

# Latency & Slowlog
slowlog-log-slower-than 10000
slowlog-max-len 128
